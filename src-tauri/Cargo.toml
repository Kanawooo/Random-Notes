[package]
name = "suijian"
version = "0.1.4"
description = "随笺 - 桌面便签"
authors = ["Suijian Team"]
license = "MIT"
edition = "2021"

[lib]
name = "suijian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.33", features = ["bundled"] }
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
# 云端备份 HTTP 客户端：走 native-tls（Windows 用系统 SChannel 与系统根证书，不额外打包 rustls 根证书）
ureq = { version = "3", default-features = false, features = ["native-tls"] }
# WebDAV PROPFIND 207 响应解析（按 local-name 匹配，兼容各前缀写法）
quick-xml = "0.41"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
arboard = "3.4"
base64 = "0.22"
# ShellExecuteExW 直开；默认路径冷启 powershell.exe，打开链接/目录滞后约 1s
open = { version = "5.3", features = ["shellexecute-on-windows"] }
directories = "5.0"
rfd = "0.15"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
